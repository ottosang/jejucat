<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CORDELIA x JBL PREMIUM SOUND ZONE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #06070a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ====================================================
       1. 상단 영업 시간 디스플레이 바 (한글 / 영어)
       ==================================================== */
    .business-hours-badge {
      position: absolute;
      top: 26px;
      left: 36px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(14, 18, 26, 0.78);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 10px 22px;
      border-radius: 30px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
      z-index: 20;
      animation: fadeInDown 1s ease-out;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 12px #00ff88;
      animation: pulseGreen 2s infinite ease-in-out;
    }

    .hours-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .hours-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
    }

    .hours-val {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .hours-sub {
      font-size: 11px;
      font-weight: 500;
      color: #ff9955;
    }

    /* ====================================================
       2. 생맥주 웰컴 쿠폰 이벤트 모션 배너 (하단 우측 플로팅)
       ==================================================== */
    .event-banner-card {
      position: absolute;
      bottom: 26px;
      right: 36px;
      width: 440px;
      background: linear-gradient(135deg, rgba(38, 48, 28, 0.90) 0%, rgba(18, 24, 15, 0.92) 100%);
      border: 1.5px solid rgba(160, 205, 95, 0.4);
      border-radius: 20px;
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), 0 0 25px rgba(110, 160, 50, 0.2);
      padding: 16px 20px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.15s ease-out;
      transform-origin: bottom right;
    }

    /* 쿠폰 헤더 */
    .eb-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 8px;
    }

    .eb-brand {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .eb-hotel {
      font-size: 11px;
      font-weight: 800;
      color: #c9e88d;
      letter-spacing: 1px;
    }

    .eb-title {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .eb-takeout-tag {
      background: #ff7700;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(255, 119, 0, 0.4);
      animation: pulseBadge 2.2s infinite;
    }

    /* 쿠폰 비주얼 콘텐츠 */
    .eb-body {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .eb-items-visual {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .beer-icon-wrap {
      position: relative;
      font-size: 32px;
      filter: drop-shadow(0 4px 10px rgba(255, 180, 0, 0.4));
      animation: floatBeer 2.4s ease-in-out infinite alternate;
    }

    .nacho-icon-wrap {
      font-size: 30px;
      filter: drop-shadow(0 4px 10px rgba(255, 160, 0, 0.35));
      animation: floatNacho 2.8s ease-in-out infinite alternate;
    }

    .plus-sign {
      color: rgba(255, 255, 255, 0.6);
      font-weight: 900;
      font-size: 16px;
    }

    .eb-info {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .eb-desc-kr {
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      text-align: right;
    }

    .eb-desc-en {
      font-size: 10.5px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.65);
      text-align: right;
    }

    .eb-price {
      font-size: 26px;
      font-weight: 900;
      color: #ffdc33;
      text-shadow: 0 0 14px rgba(255, 220, 50, 0.5);
      margin-top: 2px;
    }

    .eb-footer {
      border-top: 1px dashed rgba(255, 255, 255, 0.12);
      padding-top: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      color: rgba(255, 255, 255, 0.7);
    }

    .eb-location {
      color: #d8f59d;
      font-weight: 700;
    }

    /* ====================================================
       3. 하단 컨트롤 툴바 (3.5초 미사용 시 숨김)
       ==================================================== */
    .controls {
      position: absolute;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(14, 17, 24, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 10px 20px;
      border-radius: 40px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
      transition: opacity 0.4s ease, transform 0.4s ease;
      z-index: 100;
    }

    .controls.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(35px);
      pointer-events: none;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-1px);
    }

    .btn.primary {
      background: #ff4500;
      border-color: #ff6a33;
      box-shadow: 0 0 18px rgba(255, 69, 0, 0.5);
    }

    .btn.primary:hover {
      background: #e63e00;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ccc;
      font-size: 12px;
      padding: 0 6px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 80px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.25);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ff4500;
      cursor: pointer;
    }

    #status-toast {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 12, 18, 0.88);
      color: #eee;
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 9px 24px;
      border-radius: 22px;
      font-size: 13px;
      backdrop-filter: blur(10px);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 120;
    }

    #status-toast.show {
      opacity: 1;
    }

    /* 애니메이션 */
    @keyframes pulseGreen {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.35); opacity: 1; box-shadow: 0 0 16px #00ff88; }
    }
    @keyframes pulseBadge {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); filter: brightness(1.15); }
    }
    @keyframes floatBeer {
      0% { transform: translateY(0) rotate(-2deg); }
      100% { transform: translateY(-7px) rotate(4deg); }
    }
    @keyframes floatNacho {
      0% { transform: translateY(0) rotate(3deg); }
      100% { transform: translateY(-6px) rotate(-4deg); }
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- 메인 캔버스 -->
  <div id="canvas-container">
    <canvas id="visualizer"></canvas>
  </div>

  <!-- 1. 매장 영업 시간 (상단 좌측) -->
  <div class="business-hours-badge">
    <div class="status-dot"></div>
    <div class="hours-text">
      <div class="hours-title">OPEN 15:00 ~ 24:00</div>
      <div class="hours-val">매장 영업시간 15:00 - 24:00</div>
      <div class="hours-sub">Business Hours : 3:00 PM – 12:00 AM</div>
    </div>
  </div>

  <!-- 2. 생맥주 웰컴 쿠폰 이벤트 모션 배너 (하단 우측) -->
  <div class="event-banner-card" id="eventCard">
    <div class="eb-header">
      <div class="eb-brand">
        <span class="eb-hotel">CORDELIA</span>
        <span class="eb-title">Welcome Beer Coupon</span>
      </div>
      <span class="eb-takeout-tag">포장가능 TAKE OUT</span>
    </div>
    <div class="eb-body">
      <div class="eb-items-visual">
        <div class="beer-icon-wrap" title="TERRA Draft Beer">🍺</div>
        <span class="plus-sign">+</span>
        <div class="beer-icon-wrap" style="animation-delay: -1.2s;">🍺</div>
        <span class="plus-sign">+</span>
        <div class="nacho-icon-wrap" title="Crispy Nachos">🧀</div>
      </div>
      <div class="eb-info">
        <div class="eb-desc-kr">테라 생맥주 2잔 + 바삭 나초 세트</div>
        <div class="eb-desc-en">2 Draft Beers + Crispy Nacho Set</div>
        <div class="eb-price">₩ 10,000</div>
      </div>
    </div>
    <div class="eb-footer">
      <span class="eb-location">📍 코델리아호텔 1층 | 카페 & 펍 코델리아</span>
      <span>1st Floor / Cafe & Pub Cordelia</span>
    </div>
  </div>

  <!-- 안내 토스트 메시지 -->
  <div id="status-toast"></div>

  <!-- 3. 컨트롤 툴바 -->
  <div class="controls" id="controls">
    <button class="btn primary" id="btn-system-audio" title="윈도우 노트북 소리 연동">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
      시스템 오디오 연동
    </button>
    <button class="btn" id="btn-mic">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      마이크 연동
    </button>
    <button class="btn" id="btn-demo">데모 비트</button>

    <div class="slider-group">
      <span>감도</span>
      <input type="range" id="sensitivity" min="0.5" max="4.0" step="0.1" value="2.2">
    </div>

    <button class="btn" id="btn-fullscreen">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      전체화면
    </button>
  </div>

  <script>
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    const controls = document.getElementById('controls');
    const toast = document.getElementById('status-toast');
    const eventCard = document.getElementById('eventCard');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function showToast(msg, duration = 3000) {
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), duration);
    }

    // 마우스 미동작 시 하단 툴바만 부드럽게 숨김 (이벤트 카드/영업시간은 유지)
    let idleTimer = null;
    function resetIdleTimer() {
      controls.classList.remove('hidden');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        controls.classList.add('hidden');
      }, 3500);
    }
    window.addEventListener('mousemove', resetIdleTimer);
    resetIdleTimer();

    // ==========================================
    // 오디오 분석 엔진
    // ==========================================
    let audioCtx = null;
    let analyser = null;
    let dataArray = null;
    let sensitivity = 2.2;

    document.getElementById('sensitivity').addEventListener('input', (e) => {
      sensitivity = parseFloat(e.target.value);
    });

    function setupAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = 0.78;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 시스템 오디오 연동 (윈도우 소리 캡처)
    document.getElementById('btn-system-audio').addEventListener('click', async () => {
      try {
        setupAudioContext();
        showToast("공유 창에서 [전체 화면] 선택 후 좌측 하단 '시스템 오디오 공유'를 꼭 체크해주세요!");

        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });

        const audioTracks = stream.getAudioTracks();
        if (audioTracks.length === 0) {
          showToast("⚠️ '오디오 공유'가 체크되지 않았습니다. 다시 시도해주세요.");
          return;
        }

        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        showToast("🎵 시스템 사운드 연동 완료!");
      } catch (err) {
        console.error(err);
        showToast("연동 취소됨 또는 권한 오류");
      }
    });

    // 마이크 연동
    document.getElementById('btn-mic').addEventListener('click', async () => {
      try {
        setupAudioContext();
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        showToast("🎤 마이크 오디오 연동 완료");
      } catch (err) {
        console.error(err);
        showToast("마이크 권한을 허용해주세요.");
      }
    });

    // 데모 비트
    let demoPlaying = false;
    document.getElementById('btn-demo').addEventListener('click', () => {
      setupAudioContext();
      if (demoPlaying) {
        audioCtx.suspend();
        demoPlaying = false;
        showToast("데모 사운드 정지");
        return;
      }

      demoPlaying = true;
      showToast("🎶 묵직한 서브우퍼 킥 재생 중...");

      function playKick() {
        if (!demoPlaying) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(analyser);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(28, now + 0.38);

        gain.gain.setValueAtTime(0.9, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

        osc.start(now);
        osc.stop(now + 0.42);

        setTimeout(playKick, 580);
      }
      playKick();
    });

    // 전체화면 토글
    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    });

    // 비주얼라이저 파티클 & 충격파
    const particles = [];
    for (let i = 0; i < 90; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 2.5 + 1,
        speedX: (Math.random() - 0.5) * 0.7,
        speedY: (Math.random() - 0.5) * 0.7,
        alpha: Math.random() * 0.6 + 0.2
      });
    }

    const shockwaves = [];
    let prevBass = 0;
    let bassSmooth = 0;
    let midSmooth = 0;
    let trebleSmooth = 0;

    // ==========================================
    // 메인 렌더 루프
    // ==========================================
    function render(time) {
      requestAnimationFrame(render);

      let bass = 0, mid = 0, treble = 0;
      if (analyser && dataArray) {
        analyser.getByteFrequencyData(dataArray);

        let bassSum = 0;
        for (let i = 0; i < 8; i++) bassSum += dataArray[i];
        bass = (bassSum / 8 / 255) * sensitivity;

        let midSum = 0;
        for (let i = 8; i < 60; i++) midSum += dataArray[i];
        mid = (midSum / 52 / 255) * sensitivity;

        let trebleSum = 0;
        for (let i = 60; i < 180; i++) trebleSum += dataArray[i];
        treble = (trebleSum / 120 / 255) * sensitivity;
      }

      bassSmooth += (bass - bassSmooth) * 0.25;
      midSmooth += (mid - midSmooth) * 0.2;
      trebleSmooth += (treble - trebleSmooth) * 0.16;

      // 킥 감지 시 충격파 생성
      if (bassSmooth > 0.42 && bassSmooth - prevBass > 0.14) {
        shockwaves.push({ r: 90, opacity: 0.9, width: 4.5 });
      }
      prevBass = bassSmooth;

      // 생맥주 이벤트 배너 카드도 베이스 비트에 반응하여 살짝 펌핑 모션
      if (eventCard) {
        const cardScale = 1 + (bassSmooth * 0.035);
        eventCard.style.transform = `scale(${cardScale})`;
      }

      const cx = width / 2;
      const cy = height / 2;

      // 앰비언트 배경
      const bgGrad = ctx.createRadialGradient(cx, cy, 60, cx, cy, Math.max(width, height) * 0.75);
      bgGrad.addColorStop(0, '#151821');
      bgGrad.addColorStop(0.5, '#0b0d13');
      bgGrad.addColorStop(1, '#040507');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      // 1. 네온 리본 웨이브 라인
      const ribbonCount = 4;
      const ribbonColors = [
        'rgba(255, 75, 0, 0.45)',
        'rgba(255, 0, 130, 0.35)',
        'rgba(0, 220, 255, 0.35)',
        'rgba(140, 0, 255, 0.3)'
      ];

      for (let r = 0; r < ribbonCount; r++) {
        ctx.save();
        ctx.beginPath();
        const offsetPhase = (time * 0.0018) + (r * 0.9);
        const amp = (65 + r * 22) * (1 + bassSmooth * 0.85);

        ctx.moveTo(0, cy);
        for (let x = 0; x <= width; x += 15) {
          const normX = x / width;
          const wave = Math.sin(normX * 6 + offsetPhase) * Math.cos(normX * 3 + offsetPhase * 0.5);
          const y = cy + wave * amp + Math.sin(x * 0.01 + offsetPhase) * 22;
          ctx.lineTo(x, y);
        }

        ctx.strokeStyle = ribbonColors[r];
        ctx.lineWidth = 3 + bassSmooth * 2.5;
        ctx.shadowColor = ribbonColors[r];
        ctx.shadowBlur = 18;
        ctx.stroke();
        ctx.restore();
      }

      // 2. 대형 서브우퍼 콘 바운스 (움직임 강화)
      const baseR = Math.min(width, height) * 0.23;
      const pulseMultiplier = 1 + (bassSmooth * 0.36);
      const currentR = baseR * pulseMultiplier;

      ctx.save();
      const rimGrad = ctx.createLinearGradient(cx - currentR, cy - currentR, cx + currentR, cy + currentR);
      rimGrad.addColorStop(0, '#5a6170');
      rimGrad.addColorStop(0.5, '#1e2129');
      rimGrad.addColorStop(1, '#6b7382');

      ctx.beginPath();
      ctx.arc(cx, cy, currentR * 1.38, 0, Math.PI * 2);
      ctx.fillStyle = rimGrad;
      ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
      ctx.shadowBlur = 40;
      ctx.fill();

      // 고무 서라운드 롤 엣지
      ctx.beginPath();
      ctx.arc(cx, cy, currentR * 1.24, 0, Math.PI * 2);
      ctx.fillStyle = '#0f1116';
      ctx.lineWidth = 18 * pulseMultiplier;
      ctx.strokeStyle = '#272b35';
      ctx.stroke();
      ctx.fill();

      // 진동 콘 본체
      const coneGrad = ctx.createRadialGradient(cx, cy, 25, cx, cy, currentR);
      coneGrad.addColorStop(0, '#191d26');
      coneGrad.addColorStop(0.7, '#212633');
      coneGrad.addColorStop(1, '#0e1117');

      ctx.beginPath();
      ctx.arc(cx, cy, currentR, 0, Math.PI * 2);
      ctx.fillStyle = coneGrad;
      ctx.fill();

      // 립 텍스처
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
      ctx.lineWidth = 1.8;
      for (let ring = 0.35; ring < 0.95; ring += 0.14) {
        ctx.beginPath();
        ctx.arc(cx, cy, currentR * ring, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 우퍼 센터 돔 후광
      const centerGlow = ctx.createRadialGradient(cx, cy, 10, cx, cy, currentR * 0.65);
      centerGlow.addColorStop(0, `rgba(255, 75, 0, ${0.15 + bassSmooth * 0.25})`);
      centerGlow.addColorStop(1, 'rgba(255, 75, 0, 0)');
      ctx.fillStyle = centerGlow;
      ctx.beginPath();
      ctx.arc(cx, cy, currentR * 0.65, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 3. 충격파 링
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.r += 7.5;
        sw.opacity -= 0.016;

        if (sw.opacity <= 0) {
          shockwaves.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, sw.r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 75, 0, ${sw.opacity})`;
        ctx.lineWidth = sw.width;
        ctx.shadowColor = '#ff4500';
        ctx.shadowBlur = 18;
        ctx.stroke();
        ctx.restore();
      }

      // 4. 수직 이퀄라이저 바
      if (dataArray) {
        const barCount = 42;
        const barWidth = 4.5;
        const spread = width * 0.40;

        for (let i = 0; i < barCount; i++) {
          const freqVal = dataArray[i * 2] / 255;
          const barHeight = freqVal * 125 * (1 + bassSmooth * 0.45);
          const xOffset = (i / barCount) * spread + baseR * 1.45;

          [-1, 1].forEach(dir => {
            const bx = cx + (xOffset * dir);
            const by = cy;

            const barGrad = ctx.createLinearGradient(bx, by - barHeight, bx, by + barHeight);
            barGrad.addColorStop(0, '#ff7700');
            barGrad.addColorStop(0.5, '#ff4500');
            barGrad.addColorStop(1, 'rgba(255, 69, 0, 0)');

            ctx.fillStyle = barGrad;
            ctx.fillRect(bx - barWidth / 2, by - barHeight, barWidth, barHeight * 2);

            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#ff4500';
            ctx.shadowBlur = 8;
            ctx.fillRect(bx - barWidth / 2, by - barHeight - 2, barWidth, 3);
          });
        }
      }

      // 5. 타이포그래피 (CORDELIA 서브 + JBL PREMIUM SOUND ZONE 메인 강조)
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const textScale = 1 + (bassSmooth * 0.07);

      // (1) 상단 코델리아 라벨
      ctx.save();
      ctx.translate(cx, cy - 36);
      ctx.scale(textScale, textScale);

      ctx.font = '700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.letterSpacing = '10px';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
      ctx.shadowBlur = 8;
      ctx.fillText('CORDELIA', 5, 0);
      ctx.restore();

      // (2) 중앙 메인: JBL PREMIUM SOUND ZONE
      ctx.save();
      ctx.translate(cx, cy + 10);
      ctx.scale(textScale, textScale);

      ctx.font = '900 42px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.letterSpacing = '8px';

      const textGrad = ctx.createLinearGradient(cx - 300, 0, cx + 300, 0);
      textGrad.addColorStop(0, '#ffffff');
      textGrad.addColorStop(0.35, '#ff5500');
      textGrad.addColorStop(1, '#ffffff');
      ctx.fillStyle = textGrad;

      ctx.shadowColor = 'rgba(255, 69, 0, 0.85)';
      ctx.shadowBlur = 28 + bassSmooth * 22;
      ctx.fillText('JBL PREMIUM SOUND ZONE', 4, 0);
      ctx.restore();

      // (3) 하단 라벨
      ctx.save();
      ctx.translate(cx, cy + 56);
      ctx.scale(textScale, textScale);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-180, 0);
      ctx.lineTo(-80, 0);
      ctx.moveTo(80, 0);
      ctx.lineTo(180, 0);
      ctx.stroke();

      ctx.font = '600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.letterSpacing = '5px';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
      ctx.shadowBlur = 6;
      ctx.fillText('HIGH DEFINITION ACOUSTICS', 2.5, 0);
      ctx.restore();

      ctx.restore();

      // 6. 파티클
      ctx.save();
      for (const p of particles) {
        p.x += p.speedX * (1 + trebleSmooth * 2);
        p.y += p.speedY * (1 + trebleSmooth * 2);

        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height;
        if (p.y > height) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha * (0.6 + trebleSmooth * 0.8)})`;
        ctx.fill();
      }
      ctx.restore();
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
